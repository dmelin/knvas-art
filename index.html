<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>art.knvas.dev</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@300;400&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --cream:       #f5f0e8;
            --cream-dark:  #ede6d8;
            --cream-mid:   #e4dbc8;
            --coffee-lt:   #c8b89a;
            --coffee:      #8c7355;
            --coffee-dk:   #5c4a32;
            --ink:         #2a1f14;
            --sidebar-w:   220px;
            --gap:         3px;
        }

        html, body {
            height: 100%;
            background: var(--cream);
            color: var(--ink);
            font-family: 'Jost', sans-serif;
            font-weight: 300;
        }

        #app {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ── SIDEBAR ── */
        aside {
            width: var(--sidebar-w);
            min-width: var(--sidebar-w);
            background: var(--cream-dark);
            border-right: 1px solid var(--cream-mid);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 2.5rem 0 2rem;
        }

        .sidebar-title {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 300;
            font-style: italic;
            font-size: 1.05rem;
            color: var(--coffee);
            letter-spacing: 0.08em;
            padding: 0 1.4rem 1.8rem;
            border-bottom: 1px solid var(--cream-mid);
            margin-bottom: 1rem;
        }

        nav a {
            display: block;
            padding: 0.55rem 1.4rem;
            font-size: 0.78rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--coffee-dk);
            text-decoration: none;
            transition: background 0.15s, color 0.15s;
            cursor: pointer;
            border-left: 2px solid transparent;
        }

        nav a:hover {
            background: var(--cream-mid);
            color: var(--ink);
        }

        nav a.active {
            border-left-color: var(--coffee);
            color: var(--ink);
            background: var(--cream);
            font-weight: 400;
        }

        .sidebar-count {
            font-size: 0.65rem;
            color: var(--coffee-lt);
            margin-left: 0.4em;
            font-style: normal;
        }

        /* ── MAIN ── */
        main {
            flex: 1;
            overflow-y: auto;
            padding: var(--gap);
            background: var(--cream);
        }

        /* ── MASONRY GRID ── */
        .justified-grid {
            column-count: 4;
            column-gap: var(--gap);
        }

        @media (max-width: 1200px) {
            .justified-grid { column-count: 3; }
        }

        @media (max-width: 768px) {
            .justified-grid { column-count: 2; }
        }

        @media (max-width: 480px) {
            .justified-grid { column-count: 1; }
        }

        .grid-item {
            break-inside: avoid;
            margin-bottom: var(--gap);
            cursor: zoom-in;
            background: var(--cream-mid);
            position: relative;
            display: block;
            width: 100%;
        }

        .grid-item img {
            display: block;
            width: 100%;
            height: auto;
            transition: transform 0.4s ease, filter 0.4s ease;
        }

        .grid-item:hover img {
            transform: scale(1.03);
            filter: brightness(1.05);
        }

        .grid-item .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(42,31,20,0.55) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.3s ease;
            display: flex;
            align-items: flex-end;
            padding: 0.8rem;
        }

        .grid-item:hover .overlay {
            opacity: 1;
        }

        .overlay-tags {
            display: flex;
            gap: 0.3rem;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 0.6rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--cream);
            background: rgba(92,74,50,0.7);
            padding: 0.15rem 0.45rem;
            border-radius: 2px;
        }

        /* ── LIGHTBOX ── */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(42, 31, 20, 0.92);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: zoom-out;
            backdrop-filter: blur(6px);
        }

        .lightbox img {
            max-width: 92vw;
            max-height: 92vh;
            object-fit: contain;
            box-shadow: 0 8px 60px rgba(0,0,0,0.6);
            border-radius: 2px;
        }

        .lightbox-close {
            position: fixed;
            top: 1.5rem;
            right: 1.8rem;
            color: var(--cream);
            font-size: 1.8rem;
            cursor: pointer;
            opacity: 0.7;
            font-weight: 300;
            line-height: 1;
            z-index: 101;
            transition: opacity 0.2s;
        }
        .lightbox-close:hover { opacity: 1; }

        /* ── EMPTY STATE ── */
        .empty {
            width: 100%;
            padding: 6rem 2rem;
            text-align: center;
            color: var(--coffee-lt);
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.1rem;
        }

        /* ── MOBILE ── */
        @media (max-width: 600px) {
            aside { width: 160px; min-width: 160px; }
            nav a { font-size: 0.7rem; padding: 0.5rem 1rem; }
        }
    </style>
</head>
<body>
<div id="app">

    <aside>
        <div class="sidebar-title">art.knvas.dev</div>
        <nav>
            <a
                    v-for="album in albums"
                    :key="album.name"
                    :class="{ active: currentAlbum === album.name }"
                    @click="selectAlbum(album.name)"
            >
                {{ album.name }}
                <span class="sidebar-count">{{ album.images.length }}</span>
            </a>
        </nav>
    </aside>

    <main>
        <div class="justified-grid" v-if="currentImages.length" ref="gridRef">
            <div
                    class="grid-item"
                    v-for="(img, i) in currentImages"
                    :key="img.file"
                    @click="openLightbox(img)"
            >
                <img :src="imgPath(img.file)" :alt="img.file" loading="lazy" />
                <div class="overlay" v-if="img.tags && img.tags.length">
                    <div class="overlay-tags">
                        <span class="tag" v-for="tag in img.tags" :key="tag">{{ tag }}</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="empty" v-else>No images found.</div>
    </main>

    <!-- Lightbox -->
    <div class="lightbox" v-if="lightboxImg" @click="closeLightbox">
        <span class="lightbox-close" @click.stop="closeLightbox">&times;</span>
        <img :src="imgPath(lightboxImg.file)" @click.stop />
    </div>

</div>

<script>
    const { createApp, ref, computed, onMounted } = Vue;

    createApp({
        setup() {
            const albums = ref([]);
            const currentAlbum = ref(null);
            const lightboxImg = ref(null);

            onMounted(async () => {
                try {
                    const res = await fetch('./albums.json');
                    const data = await res.json();
                    // Sort albums alphabetically
                    albums.value = data.albums.sort((a, b) => a.name.localeCompare(b.name));
                } catch (e) {
                    console.error('Could not load albums.json', e);
                }
            });

            const currentImages = computed(() => {
                let images = [];

                if (currentAlbum.value === null) {
                    // No filter active - show all images from all albums
                    images = albums.value.flatMap(album => album.images);
                } else {
                    // Filter active - show only images from selected album
                    const album = albums.value.find(a => a.name === currentAlbum.value);
                    images = album ? album.images : [];
                }

                // Sort images alphabetically by filename
                return images.sort((a, b) => a.file.localeCompare(b.file));
            });

            function selectAlbum(name) {
                // Toggle: if clicking active album, deactivate it
                currentAlbum.value = currentAlbum.value === name ? null : name;
                lightboxImg.value = null;
            }

            function openLightbox(img) { lightboxImg.value = img; }
            function closeLightbox() { lightboxImg.value = null; }
            function imgPath(file) { return './artwork/' + file; }

            return { albums, currentAlbum, currentImages, lightboxImg, selectAlbum, openLightbox, closeLightbox, imgPath };
        }
    }).mount('#app');
</script>
</body>
</html>
